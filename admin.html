<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - মানবকল্যাণ যুব সংঘ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#0f172a;
  color:#fff;
}

.header{
  padding:25px 18px;
  text-align:center;
  background:#111827;
  border-bottom:1px solid #334155;
}

.header h1{
  margin:0 0 8px;
  font-size:25px;
}

.header p{
  margin:0;
  color:#94a3b8;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 15px;
}

.login-box,
.dashboard{
  background:#111827;
  border:1px solid #334155;
  border-radius:15px;
  padding:20px;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0 12px;
  border-radius:9px;
  border:1px solid #475569;
  background:#1e293b;
  color:#fff;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  background:#2563eb;
  color:#fff;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:20px;
}

.menu a{
  text-decoration:none;
  color:#fff;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:13px;
  padding:22px 12px;
  text-align:center;
  transition:.2s;
}

.menu a:hover{
  background:#263449;
  transform:translateY(-2px);
}

.icon{
  display:block;
  font-size:32px;
  margin-bottom:9px;
}

.menu-title{
  font-weight:bold;
  font-size:16px;
}

.menu-text{
  display:block;
  color:#94a3b8;
  font-size:12px;
  margin-top:5px;
}

.logout{
  margin-top:22px;
  background:#dc2626;
}

.msg{
  margin-top:12px;
  color:#fbbf24;
  text-align:center;
}

.hidden{
  display:none;
}

@media(max-width:500px){
  .menu{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>🛠️ Admin Panel</h1>
  <p>মানবকল্যাণ যুব সংঘ</p>
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="login-box">

    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">🔐 Login</button>

    <div id="loginMsg" class="msg"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard hidden">

    <h2>📊 Admin Dashboard</h2>

    <p style="color:#94a3b8">
      প্রয়োজনীয় বিভাগ নির্বাচন করুন।
    </p>

    <div class="menu">

      <a href="payments.html">
        <span class="icon">💰</span>
        <span class="menu-title">Payment</span>
        <span class="menu-text">bKash Payment যাচাই</span>
      </a>

      <a href="donors.html">
        <span class="icon">🩸</span>
        <span class="menu-title">Blood Donors</span>
        <span class="menu-text">রক্তদাতার তালিকা</span>
      </a>

      <a href="volunteers.html">
        <span class="icon">🤝</span>
        <span class="menu-title">Volunteers</span>
        <span class="menu-text">স্বেচ্ছাসেবক তালিকা</span>
      </a>

      <a href="transactions.html">
        <span class="icon">💵</span>
        <span class="menu-title">Transactions</span>
        <span class="menu-text">আয়-ব্যয়ের হিসাব</span>
      </a>

      <a href="reports.html">
        <span class="icon">📊</span>
        <span class="menu-title">Reports</span>
        <span class="menu-text">আর্থিক রিপোর্ট</span>
      </a>

    </div>

    <button class="logout" onclick="logout()">
      🚪 Logout
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const sb = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);


async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("loginMsg");

  if(!email || !password){
    msg.textContent="⚠️ Email ও Password দিন।";
    return;
  }

  msg.textContent="⏳ Login হচ্ছে...";

  const {error} = await sb.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){

    console.error(error);

    msg.textContent=
      "❌ Login ব্যর্থ। Email বা Password সঠিক কিনা দেখুন।";

    return;
  }

  showDashboard();
}


async function checkLogin(){

  const {data} =
    await sb.auth.getSession();

  if(data.session){
    showDashboard();
  }
}


function showDashboard(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");
}


async function logout(){

  await sb.auth.signOut();

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("email").value="";
  document.getElementById("password").value="";
}


checkLogin();

</script>

</body>
</html>
