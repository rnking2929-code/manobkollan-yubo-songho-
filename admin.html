<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অ্যাডমিন | মানবকল্যাণ যুব সংঘ</title><style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#101418;color:#f5f7fa} .wrap{max-width:850px;margin:auto;padding:20px}.card{background:#171d23;border:1px solid #2b333b;border-radius:18px;padding:18px;margin:14px 0} input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #39424b;background:#0e1317;color:#fff}button{cursor:pointer;background:#2563eb;border:0;font-weight:700}.danger{background:#b91c1c}.muted{color:#aeb8c2}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}} .item{border-top:1px solid #2b333b;padding:12px 0;display:flex;justify-content:space-between;gap:12px}.income{color:#4ade80}.expense{color:#fb7185}</style></head><body><div class="wrap"><h1>🔐 অ্যাডমিন প্যানেল</h1><p class="muted">মানবকল্যাণ যুব সংঘ — আয়/ব্যয় পরিচালনা</p>
<div id="login" class="card"><h2>অ্যাডমিন লগইন</h2><input id="email" type="email" placeholder="অ্যাডমিন ইমেইল"><input id="password" type="password" placeholder="পাসওয়ার্ড"><button id="loginBtn">লগইন</button><p id="loginMsg" class="muted"></p></div>
<div id="panel" style="display:none"><div class="card"><h2>নতুন লেনদেন যোগ করুন</h2><div class="row"><select id="type"><option value="income">আয় / জমা</option><option value="expense">খরচ</option></select><input id="amount" type="number" min="1" step="0.01" placeholder="টাকার পরিমাণ"></div><input id="title" placeholder="বিবরণ, যেমন: সদস্য চাঁদা / খাদ্য সহায়তা"><input id="donor" placeholder="দাতার নাম (না চাইলে Anonymous)"><input id="date" type="date"><textarea id="note" placeholder="নোট"></textarea><button id="addBtn">লেনদেন সংরক্ষণ</button><p id="msg" class="muted"></p></div><div class="card"><h2>সাম্প্রতিক লেনদেন</h2><div id="list"></div></div><button id="logout" class="danger">লগআউট</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);
async function load(){const {data,error}=await sb.from('transactions').select('*').order('transaction_date',{ascending:false}).order('created_at',{ascending:false}); if(error){$('list').textContent=error.message;return} $('list').innerHTML=data.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.donor_name||'Anonymous')} · ${x.transaction_date}</div></div><div class="${x.type}">${x.type==='income'?'+':'−'} ৳${Number(x.amount).toLocaleString('bn-BD')}</div></div>`).join('')||'<p class="muted">কোনো রেকর্ড নেই</p>'}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function check(){const {data:{session}}=await sb.auth.getSession(); if(session){$('login').style.display='none';$('panel').style.display='block';load()}}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'লগইন সফল';if(!error)check()};
$('addBtn').onclick=async()=>{const amount=Number($('amount').value);if(!amount||!$('title').value){$('msg').textContent='পরিমাণ ও বিবরণ দিন।';return}const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('transactions').insert({type:$('type').value,amount,title:$('title').value,donor_name:$('donor').value||'Anonymous',note:$('note').value,transaction_date:$('date').value,created_by:user.id});$('msg').textContent=error?error.message:'সফলভাবে যোগ হয়েছে।';if(!error){$('amount').value='';$('title').value='';$('donor').value='';$('note').value='';load()}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};check();</script></body></html>
