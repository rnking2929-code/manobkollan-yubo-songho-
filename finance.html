<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আয়-ব্যয়ের হিসাব | মানবকল্যাণ যুব সংঘ</title><style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0e1216;color:#f5f7fa}.wrap{max-width:900px;margin:auto;padding:18px}.hero{background:#171d23;border:1px solid #2b333b;border-radius:20px;padding:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.card{background:#171d23;border:1px solid #2b333b;border-radius:16px;padding:16px}.num{font-size:25px;font-weight:800;margin-top:5px}.green{color:#4ade80}.red{color:#fb7185}.blue{color:#60a5fa}.list .tx{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #2b333b}.muted{color:#aeb8c2;font-size:14px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#27313a;font-size:12px}a{color:#93c5fd;text-decoration:none}@media(max-width:650px){.cards{grid-template-columns:1fr}.tx{font-size:14px}}</style></head><body><div class="wrap"><div class="hero"><h1>💰 আয়-ব্যয়ের হিসাব</h1><p class="muted">মানবকল্যাণ যুব সংঘ · জনসাধারণের জন্য উন্মুক্ত হিসাব</p><p>বিকাশ: <b id="bkash">01XXXXXXXXX</b></p></div><div class="cards"><div class="card"><div class="muted">মোট জমা</div><div id="income" class="num green">৳০</div></div><div class="card"><div class="muted">মোট খরচ</div><div id="expense" class="num red">৳০</div></div><div class="card"><div class="muted">বর্তমান ব্যালেন্স</div><div id="balance" class="num blue">৳০</div></div></div><div class="card list"><h2>📋 লেনদেনের তালিকা</h2><div id="list">লোড হচ্ছে...</div></div><p class="muted">দাতাদের ব্যক্তিগত ফোন নম্বর বা সংবেদনশীল তথ্য প্রকাশ করা হয় না।</p><p><a href="index.html">← মূল ওয়েবসাইটে ফিরে যান</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);document.getElementById('bkash').textContent=window.BKASH_NUMBER;
const money=n=>'৳'+Number(n).toLocaleString('bn-BD',{maximumFractionDigits:2});const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function run(){const {data,error}=await sb.from('transactions').select('*').order('transaction_date',{ascending:false}).order('created_at',{ascending:false});if(error){document.getElementById('list').textContent='ডাটাবেস সংযোগ হয়নি। config.js সেটআপ করুন।';return}let i=0,e=0;data.forEach(x=>x.type==='income'?i+=Number(x.amount):e+=Number(x.amount));document.getElementById('income').textContent=money(i);document.getElementById('expense').textContent=money(e);document.getElementById('balance').textContent=money(i-e);document.getElementById('list').innerHTML=data.map(x=>`<div class="tx"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.donor_name||'Anonymous')} · ${x.transaction_date}</div></div><div class="${x.type==='income'?'green':'red'}"><span class="pill">${x.type==='income'?'জমা':'খরচ'}</span> ${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`).join('')||'<p class="muted">কোনো লেনদেন নেই।</p>'}run();</script></body></html>
