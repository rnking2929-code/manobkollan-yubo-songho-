<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>স্বেচ্ছাসেবক - মানবকল্যাণ যুব সংঘ</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#0f172a;
  color:#fff;
}

/* HEADER */

.header{
  text-align:center;
  padding:28px 15px;
  background:#111827;
  border-bottom:1px solid #334155;
}

.header h1{
  margin:0 0 8px;
  font-size:27px;
}

.header p{
  margin:0;
  color:#94a3b8;
}

/* CONTAINER */

.container{
  max-width:850px;
  margin:auto;
  padding:25px 15px;
}

/* BOX */

.box{
  background:#111827;
  border:1px solid #334155;
  border-radius:16px;
  padding:22px;
  margin-bottom:22px;
}

.box h2{
  margin-top:0;
}

/* FORM */

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  font-size:14px;
  color:#cbd5e1;
}

input,
select,
textarea{

  width:100%;

  padding:13px;

  border-radius:9px;

  border:1px solid #475569;

  background:#1e293b;

  color:#fff;

  font-size:14px;

}

textarea{
  min-height:100px;
  resize:vertical;
}

button{

  width:100%;

  padding:13px;

  margin-top:15px;

  border:0;

  border-radius:9px;

  background:#16a34a;

  color:#fff;

  font-weight:bold;

  font-size:15px;

  cursor:pointer;

}

button:hover{
  opacity:.9;
}

/* MESSAGE */

.msg{
  text-align:center;
  margin-top:12px;
  color:#fbbf24;
}

/* VOLUNTEERS */

.volunteer-list{
  display:grid;
  gap:12px;
}

.volunteer{

  background:#1e293b;

  border:1px solid #334155;

  border-radius:12px;

  padding:15px;

}

.volunteer-name{

  font-size:18px;

  font-weight:bold;

  margin-bottom:7px;

}

.volunteer-info{

  color:#cbd5e1;

  font-size:13px;

  line-height:1.8;

}

.badge{

  display:inline-block;

  padding:4px 8px;

  border-radius:5px;

  background:#14532d;

  color:#bbf7d0;

  font-size:11px;

}

/* FOOTER */

.footer{

  text-align:center;

  color:#64748b;

  font-size:12px;

  padding:25px 10px;

}

/* MOBILE */

@media(max-width:500px){

  .container{
    padding:15px 10px;
  }

  .box{
    padding:17px;
  }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

  <h1>🤝 স্বেচ্ছাসেবক</h1>

  <p>
    মানবকল্যাণ যুব সংঘ
  </p>

</div>



<div class="container">


<!-- =========================
     VOLUNTEER FORM
========================= -->

<div class="box">

  <h2>
    🤝 স্বেচ্ছাসেবক হিসেবে যোগ দিন
  </h2>

  <p style="color:#94a3b8;font-size:13px;line-height:1.7">

    মানবকল্যাণ যুব সংঘের মানবকল্যাণমূলক কার্যক্রমে
    স্বেচ্ছাসেবক হিসেবে যুক্ত হতে নিচের ফর্মটি পূরণ করুন।

  </p>


  <label>
    নাম *
  </label>

  <input
    type="text"
    id="name"
    placeholder="আপনার পূর্ণ নাম"
  >


  <label>
    মোবাইল নম্বর *
  </label>

  <input
    type="tel"
    id="phone"
    placeholder="01XXXXXXXXX"
  >


  <label>
    বয়স *
  </label>

  <input
    type="number"
    id="age"
    placeholder="আপনার বয়স"
    min="10"
    max="100"
  >


  <label>
    এলাকা *
  </label>

  <input
    type="text"
    id="area"
    placeholder="গ্রাম / ইউনিয়ন / উপজেলা"
  >


  <label>
    পেশা
  </label>

  <input
    type="text"
    id="profession"
    placeholder="শিক্ষার্থী / চাকরি / ব্যবসা ইত্যাদি"
  >


  <label>
    কেন স্বেচ্ছাসেবক হতে চান? *
  </label>

  <textarea
    id="reason"
    placeholder="মানবকল্যাণমূলক কাজে যুক্ত হওয়ার কারণ লিখুন..."
  ></textarea>


  <button
    onclick="submitVolunteer()"
  >
    🤝 স্বেচ্ছাসেবক হওয়ার আবেদন করুন
  </button>


  <div
    id="msg"
    class="msg"
  ></div>

</div>



<!-- =========================
     APPROVED VOLUNTEERS
========================= -->

<div class="box">

  <h2>
    🤝 আমাদের স্বেচ্ছাসেবক
  </h2>

  <p style="color:#94a3b8;font-size:13px">
    অনুমোদিত স্বেচ্ছাসেবকদের তালিকা
  </p>


  <div
    id="volunteerList"
    class="volunteer-list"
  >

    <div style="
      text-align:center;
      color:#94a3b8;
    ">
      ⏳ তালিকা লোড হচ্ছে...
    </div>

  </div>

</div>


</div>


<!-- FOOTER -->

<div class="footer">

  © মানবকল্যাণ যুব সংঘ

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

/* =========================
   SUPABASE
========================= */

const sb = supabase.createClient(

  window.SUPABASE_URL,

  window.SUPABASE_ANON_KEY

);



/* =========================
   SUBMIT VOLUNTEER
========================= */

async function submitVolunteer(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const age =
    document
      .getElementById("age")
      .value
      .trim();


  const area =
    document
      .getElementById("area")
      .value
      .trim();


  const profession =
    document
      .getElementById("profession")
      .value
      .trim();


  const reason =
    document
      .getElementById("reason")
      .value
      .trim();


  const msg =
    document
      .getElementById("msg");


  /* VALIDATION */

  if(!name){

    msg.textContent =
      "⚠️ আপনার নাম লিখুন।";

    return;

  }


  if(!phone){

    msg.textContent =
      "⚠️ মোবাইল নম্বর দিন।";

    return;

  }


  if(!age){

    msg.textContent =
      "⚠️ বয়স দিন।";

    return;

  }


  if(!area){

    msg.textContent =
      "⚠️ আপনার এলাকা দিন।";

    return;

  }


  if(!reason){

    msg.textContent =
      "⚠️ কেন স্বেচ্ছাসেবক হতে চান তা লিখুন।";

    return;

  }


  msg.textContent =
    "⏳ আবেদন জমা হচ্ছে...";


  /* INSERT */

  const {error} =

    await sb
      .from("volunteer_applications")
      .insert({

        name:name,

        phone:phone,

        age:age,

        area:area,

        profession:
          profession || null,

        reason:reason,

        status:"pending"

      });


  if(error){

    console.error(error);

    msg.textContent =
      "❌ আবেদন জমা হয়নি। আবার চেষ্টা করুন।";

    return;

  }


  msg.textContent =
    "✅ আপনার আবেদন সফলভাবে জমা হয়েছে। Admin যাচাই করার পর অনুমোদন করা হবে।";


  /* CLEAR */

  document
    .getElementById("name")
    .value = "";


  document
    .getElementById("phone")
    .value = "";


  document
    .getElementById("age")
    .value = "";


  document
    .getElementById("area")
    .value = "";


  document
    .getElementById("profession")
    .value = "";


  document
    .getElementById("reason")
    .value = "";

}



/* =========================
   LOAD APPROVED VOLUNTEERS
========================= */

async function loadVolunteers(){

  const list =
    document
      .getElementById("volunteerList");


  const {data,error} =

    await sb
      .from("volunteer_applications")
      .select(
        "id,name,area,profession,status,created_at"
      )
      .eq("status","approved")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    list.innerHTML =
      '<div style="text-align:center;color:#fca5a5">❌ তালিকা লোড করা যায়নি।</div>';

    return;

  }


  if(!data || data.length === 0){

    list.innerHTML =
      '<div style="text-align:center;color:#94a3b8;padding:15px">এখনও কোনো অনুমোদিত স্বেচ্ছাসেবক নেই।</div>';

    return;

  }


  list.innerHTML =

    data.map(v => {

      return `

        <div class="volunteer">

          <div class="volunteer-name">

            ${escapeHTML(v.name)}

          </div>

          <div class="volunteer-info">

            <span class="badge">
              Active Volunteer
            </span>

            <br>

            📍 এলাকা:
            ${escapeHTML(v.area || "উল্লেখ নেই")}

            <br>

            💼 পেশা:
            ${escapeHTML(v.profession || "উল্লেখ নেই")}

          </div>

        </div>

      `;

    }).join("");

}



/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* =========================
   START
========================= */

loadVolunteers();

</script>

</body>

</html>
